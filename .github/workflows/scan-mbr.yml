name: Scan MBR Automatico 8:30 y 14:30
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
jobs:
  scan-mbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Escanear MBR con precio real
        run: node scan-mbr.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MBR_BEARER_TOKEN: ${{ secrets.MBR_BEARER_TOKEN }}
