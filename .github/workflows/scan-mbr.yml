name: scan-mbr
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan MBR real
        env:
          MBR_PASS: ${{ secrets.MBR_PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq > /dev/null

          echo "Login a mbr.demachine.co..."
          RESP=$(curl -s -k -X POST https://mbr.demachine.co/api/users/token \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"CARLSO ROJAS\",\"password\":\"$MBR_PASS\",\"instance\":\"mbr\"}")

          echo "$RESP" | head -c 500
          echo ""

          TOKEN=$(echo "$RESP" | jq -r '.data.token // .token // .access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: no token"
            exit 1
          fi

          echo "Token OK: ${TOKEN:0:20}..."

          echo "== ME =="
          curl -s -k https://mbr.demachine.co/api/users/me \
            -H "Authorization: Bearer $TOKEN" -H "Origin: https://estock-mobile.demachine.co" > me.txt
          cat me.txt | head -c 1500
          echo ""

          echo "== PRODUCTOS =="
          curl -s -k "https://mbr.demachine.co/api/getClientProduct" \
            -H "Authorization: Bearer $TOKEN" -H "Origin: https://estock-mobile.demachine.co" > prod.txt
          cat prod.txt | head -c 1500
          echo ""

          echo "== INDEXME =="
          curl -s -k "https://mbr.demachine.co/api/indexMe?page=1&maxPerPage=5" \
            -H "Authorization: Bearer $TOKEN" -H "Origin: https://estock-mobile.demachine.co" > index.txt
          cat index.txt | head -c 1500
          echo ""

          ls -lh *.txt
