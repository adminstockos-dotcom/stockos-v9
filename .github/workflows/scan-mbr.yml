name: Scan MBR Automatico 8:30 y 14:30

on:
  schedule:
    - cron: '30 13 * * *'  # 8:30 AM Colombia (13:30 UTC)
    - cron: '30 19 * * *'  # 2:30 PM Colombia (19:30 UTC)
  workflow_dispatch:

jobs:
  scan-mbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Escanear MBR 197 productos
        run: |
          echo "Iniciando escaneo MBR - 197 productos"
          node scan-mbr.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MBR_USER: "CARLOS ROJAS"
          MBR_PASS: "CARLOS2026"
