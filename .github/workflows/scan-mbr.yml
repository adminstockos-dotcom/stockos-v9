name: Scan MBR Automatico 8:30 y 14:30
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
jobs:
  scan-mbr:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ESTOCK_INSTANCIA: ${{ secrets.ESTOCK_INSTANCIA }}
      ESTOCK_USUARIO: ${{ secrets.ESTOCK_USUARIO }}
      ESTOCK_PASSWORD: ${{ secrets.ESTOCK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install @supabase/supabase-js ws
      - name: Ejecutar scan MBR con precios Estock reales
        run: node scan-mbr.mjs
