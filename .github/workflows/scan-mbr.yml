name: Scan MBR Automatico 8:30 y 14:30
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
jobs:
  scan-mbr:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ESTOCK_INSTANCIA: ${{ secrets.ESTOCK_INSTANCIA }}
      ESTOCK_USUARIO: ${{ secrets.ESTOCK_USUARIO }}
      ESTOCK_PASSWORD: ${{ secrets.ESTOCK_PASSWORD }}
    steps:
      - name: Llamar a Vercel para scan MBR
        run: curl -s "https://stockos-v9.vercel.app/api/scan-mbr?secret=stockos2024"
